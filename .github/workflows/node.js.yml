# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
    # Signature-verified pnpm via corepack, at the devEngines.packageManager pin.
    - name: Install pnpm
      run: |
        corepack enable pnpm
        corepack install -g "pnpm@$(node -p "require('./package.json').devEngines.packageManager.version")"
    - run: pnpm install --frozen-lockfile
    - run: pnpm run lint
    - run: pnpm run stylelint
    - run: pnpm exec tsc -noEmit
    - run: node scripts/build.js
    - run: pnpm run typecheck:logger
    - run: pnpm run build:logger
    - run: pnpm run typecheck:site
    - run: pnpm run build:site
      env:
        NEXT_TELEMETRY_DISABLED: 1
