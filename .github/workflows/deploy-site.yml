name: Deploy site

# Gates a `site-v*` tag, then triggers Dokploy, which builds packages/site/Dockerfile.
# Dokploy's own auto-deploy on push must be off.
on:
  push:
    tags:
      - 'site-v*'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the tag matches the package version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#site-v}"
          PKG_VERSION="$(node -p "require('./packages/site/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION" >&2
            exit 1
          fi

      # Dokploy builds main's head, not the tag.
      - name: Verify the tag is the head of main
        if: github.event_name == 'push'
        run: |
          git fetch --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "$GITHUB_REF_NAME is not the head of main, which is what Dokploy builds." >&2
            exit 1
          fi

      - uses: ./.github/actions/setup

      - run: pnpm exec nx run-many -t lint typecheck build -p site
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Check for Dokploy credentials
        id: creds
        run: |
          if [ -n "${{ secrets.DOKPLOY_API_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No DOKPLOY_* secrets set - the release was verified but not deployed."
          fi

      - name: Deploy on Dokploy
        if: steps.creds.outputs.present == 'true'
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "${DOKPLOY_URL%/}/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'Content-Type: application/json' \
            -d "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\"}"
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
