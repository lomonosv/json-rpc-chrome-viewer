name: Publish server-logger

# Tagged separately from the extension: the extension's own releases tag
# `v<version>` and trigger the Chrome Web Store deploy, and the two version
# lines move independently.
on:
  push:
    tags:
      - 'server-logger-v*'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Pack and inspect only, do not publish'
        type: boolean
        default: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance, which links the published tarball to the
      # commit and workflow that produced it.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      # pnpm comes from corepack, which verifies the release against npm's
      # signing keys - no third-party setup action. Corepack only reads
      # `packageManager`, so the version is taken from the single pin in
      # devEngines.packageManager instead.
      - name: Install pnpm
        run: |
          corepack enable pnpm
          corepack install -g "pnpm@$(node -p "require('./package.json').devEngines.packageManager.version")"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run typecheck:logger

      - name: Verify the tag matches the package version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#server-logger-v}"
          PKG_VERSION="$(node -p "require('./packages/server-logger/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION" >&2
            exit 1
          fi

      # Pack and publish stay on npm: it is the client npm trusted publishing
      # (OIDC) is configured and proven against, and the package has no
      # `workspace:` dependencies for pnpm to rewrite, so the tarball is the same.
      - name: Pack
        working-directory: packages/server-logger
        run: npm pack

      # A prerelease must never become what `npm install` resolves to, so the
      # dist-tag is derived from the version rather than defaulted: anything
      # carrying a `-` (0.2.0-rc.0) publishes under `next`, everything else
      # under `latest`. This is what makes a real end-to-end publish safe to
      # rehearse against the live registry.
      - name: Resolve dist-tag
        id: distTag
        run: |
          PKG_VERSION="$(node -p "require('./packages/server-logger/package.json').version")"
          case "$PKG_VERSION" in
            *-*) TAG=next ;;
            *)   TAG=latest ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $PKG_VERSION under dist-tag $TAG"

      # Authentication is npm trusted publishing (OIDC): the job proves its
      # identity with the id-token permission above, so there is no token to
      # store or rotate. Deliberately no NODE_AUTH_TOKEN — setup-node writes
      # `_authToken=${NODE_AUTH_TOKEN}` into .npmrc, and an unset secret would
      # put a blank token there that shadows the OIDC exchange.
      #
      # Configured at npmjs.com on the package's Settings tab:
      #   repository lomonosv/json-rpc-chrome-viewer, workflow
      #   publish-server-logger.yml. Provenance is generated automatically.
      - name: Publish
        if: github.event_name == 'push' || inputs.dryRun == false
        working-directory: packages/server-logger
        run: >-
          npm publish --provenance
          --tag ${{ steps.distTag.outputs.tag }}
