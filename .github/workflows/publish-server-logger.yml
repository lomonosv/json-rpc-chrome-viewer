name: Publish server-logger

on:
  push:
    tags:
      - 'server-logger-v*'
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Pack and inspect only, do not publish'
        type: boolean
        default: true

concurrency:
  group: publish-server-logger
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # npm trusted publishing (OIDC) and provenance.
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the tag matches the package version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#server-logger-v}"
          PKG_VERSION="$(node -p "require('./packages/server-logger/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION" >&2
            exit 1
          fi

      - uses: ./.github/actions/setup
        with:
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm exec nx run-many -t lint typecheck build -p server-logger

      # npm, not pnpm: trusted publishing is set up against the npm client.
      - name: Pack
        working-directory: packages/server-logger
        run: npm pack

      # Prereleases (a `-` in the version) go to `next`, never `latest`.
      - name: Resolve dist-tag
        id: distTag
        run: |
          PKG_VERSION="$(node -p "require('./packages/server-logger/package.json').version")"
          case "$PKG_VERSION" in
            *-*) TAG=next ;;
            *)   TAG=latest ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $PKG_VERSION under dist-tag $TAG"

      # No NODE_AUTH_TOKEN: a blank one would shadow the OIDC exchange.
      # The trusted publisher on npmjs.com names this file: publish-server-logger.yml.
      - name: Publish
        if: github.event_name == 'push' || inputs.dryRun == false
        working-directory: packages/server-logger
        run: >-
          npm publish --provenance
          --tag ${{ steps.distTag.outputs.tag }}
