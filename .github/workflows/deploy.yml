name: Deploy to Chrome Web Store

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to users (unchecked = upload as draft only)'
        type: boolean
        default: false

jobs:
  deploy:
    # a pre-release must not auto-publish to users; dispatch it manually instead
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      # pnpm comes from corepack, which verifies the release against npm's
      # signing keys - no third-party setup action. Corepack only reads
      # `packageManager`, so the version is taken from the single pin in
      # devEngines.packageManager instead.
      - name: Install pnpm
        run: |
          corepack enable pnpm
          corepack install -g "pnpm@$(node -p "require('./package.json').devEngines.packageManager.version")"

      # Frozen lockfile; pnpm-workspace.yaml enforces the supply-chain policies.
      - run: pnpm install --frozen-lockfile

      # scripts/envSubstitute.js reads .env through dotenv and exits 1 if it
      # parses nothing, so the secrets have to land on disk before the build.
      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          ENVIRONMENT=${{ secrets.ENVIRONMENT }}
          SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
          EOF

      # clean -> lint -> tsc -> esbuild (+ Sentry sourcemap upload) -> env substitution
      - run: pnpm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Verify manifest version matches the tag
        if: github.event_name == 'release'
        run: |
          MANIFEST=$(node -p "require('./build/manifest.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$MANIFEST" != "$TAG" ]; then
            echo "manifest.json is $MANIFEST but the tag is $TAG"
            exit 1
          fi
          echo "version=$MANIFEST" >> "$GITHUB_ENV"

      - name: Zip the build folder contents
        run: (cd build && zip -r ../extension.zip .)

      - name: Check for store credentials
        id: creds
        run: |
          if [ -n "${{ secrets.CWS_REFRESH_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No CWS_* secrets set - skipping the store upload. Download extension.zip from this run and upload it manually."
          fi

      # A locked devDependency, not `npx`: this step holds the store
      # credentials, so the uploader goes through the same lockfile and
      # supply-chain policies as everything else.
      #
      # v4 has no --auto-publish flag, and silently ignores it if passed - a
      # release would upload as a draft and the job would still go green.
      # Instead the command decides: none = upload + publish, `upload` = draft.
      - name: Upload to Chrome Web Store
        if: steps.creds.outputs.present == 'true'
        run: |
          if [ -z "$PUBLISHER_ID" ]; then
            echo "::error::CWS_PUBLISHER_ID secret is not set - chrome-webstore-upload v4 requires it."
            exit 1
          fi
          if [ "$PUBLISH" = "true" ]; then
            pnpm exec chrome-webstore-upload --source extension.zip
          else
            pnpm exec chrome-webstore-upload upload --source extension.zip
          fi
        env:
          PUBLISH: ${{ github.event_name == 'release' || inputs.publish }}
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          # v4 talks to the Chrome Web Store API v2, which needs the publisher id.
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}

      - name: Upload the zip as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: extension.zip
          retention-days: 30

      - name: Attach the zip to the GitHub release
        if: github.event_name == 'release'
        run: gh release upload "$GITHUB_REF_NAME" extension.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
